<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }

        main {
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .blog-post {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .blog-post h2 {
            color: #333;
            margin-top: 0;
        }

        .date {
            color: #666;
            font-size: 0.9em;
        }

        .sidebar h3 {
            margin-top: 0;
            color: #333;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin-bottom: 10px;
        }

        .sidebar a {
            color: #333;
            text-decoration: none;
        }

        .sidebar a:hover {
            color: #666;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Personal Blog</h1>
        <p>Welcome to my thoughts and ideas</p>
    </header>

    <div class="container">
        <main>
            <iframe id="blog-content" src="posts/first-post.html" style="width: 100%; border: none; height: 300px;"></iframe>
        </main>

        <aside class="sidebar">
            <h3>Recent Posts</h3>
            <ul>
                <li><a href="posts/first-post.html" target="blog-content">First Blog Post</a></li>
                <li><a href="posts/second-post.html" target="blog-content">Second Blog Post</a></li>
                <li><a href="posts/third-post.html" target="blog-content">Third Blog Post</a></li>
            </ul>
            <h3>About</h3>
            <p>Welcome to my blog where I share my thoughts and experiences.</p>
            <h3>Contact</h3>
            <p>Follow me on social media or email me at contact@example.com</p>
        </aside>
    </div>

    <script>
        // Adjust iframe height based on content
        window.addEventListener('message', function(e) {
            const iframe = document.getElementById('blog-content');
            iframe.style.height = e.data + 'px';
        });
    </script>
</body>
</html>
